services:
  terabox-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      # Built-in web dashboard (activity log: file uploads + network errors)
      - "8080:8080"
    volumes:
      - terabox_data:/app/data
    stop_grace_period: 30s

volumes:
  terabox_data:
